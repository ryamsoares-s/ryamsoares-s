<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ryam Soares — Desenvolvedor Full-Stack e Professor no IFMT">
  <defs>
    <style>
      .m { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .prompt { fill: #9DBF88; } .cmd { fill: #F2E8D5; } .dim { fill: #8A9A8E; }
      .k { fill: #8A9A8E; font-size: 14px; } .v { fill: #F2E8D5; font-size: 14px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <!-- janela do terminal -->
  <rect x="1" y="1" width="1198" height="338" rx="12" fill="#0E1411" stroke="#2A3A30" stroke-width="2"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 H1187 a12 12 0 0 1 12 12 V40 H1 z" fill="#141A16"/>
  <line x1="1" y1="40" x2="1199" y2="40" stroke="#2A3A30" stroke-width="1.5"/>
  <circle cx="26" cy="21" r="6.5" fill="#C2502E"/>
  <circle cx="48" cy="21" r="6.5" fill="#E8A33D"/>
  <circle cx="70" cy="21" r="6.5" fill="#9DBF88"/>
  <text class="m dim" x="600" y="26" font-size="13" text-anchor="middle">ryamsoares-s: ~</text>

  <!-- sessão -->
  <g class="m">
    <text x="44" y="86" font-size="17"><tspan class="prompt">ryamsoares-s:~$</tspan><tspan class="cmd"> whoami</tspan></text>
    <text x="42" y="150" font-size="58" font-weight="700" fill="#F2E8D5" letter-spacing="1">Ryam Soares</text>
    <text x="44" y="190" font-size="21" fill="#E8A33D">Desenvolvedor Full-Stack · Professor no IFMT</text>

    <text x="44" y="238" font-size="17"><tspan class="prompt">ryamsoares-s:~$</tspan><tspan class="cmd"> cat atuacao.txt</tspan></text>
    <text x="44" y="266" font-size="16" fill="#F2E8D5" opacity=".85">Sistemas web para energia, agronegócio e educação.</text>

    <text x="44" y="310" font-size="17"><tspan class="prompt">ryamsoares-s:~$</tspan></text>
    <rect class="cursor" x="206" y="296" width="10" height="18" fill="#E8A33D"/>
  </g>

  <!-- painel de resumo, à direita -->
  <line x1="810" y1="70" x2="810" y2="306" stroke="#2A3A30" stroke-width="1.5"/>
  <g class="m">
    <text x="842" y="86" font-size="15" fill="#E8A33D" font-weight="700">ryamsoares-s</text>
    <text x="842" y="102" font-size="14" fill="#2A3A30">───────────────────────────</text>
    <text x="842" y="124"><tspan class="k">Função</tspan><tspan x="950" class="v">Desenvolvedor Full-Stack</tspan></text>
    <text x="842" y="148"><tspan class="k">Empresa</tspan><tspan x="950" class="v">TerraWatt Tecnologia</tspan></text>
    <text x="842" y="172"><tspan class="k">Linguagem</tspan><tspan x="950" class="v">TypeScript</tspan></text>
    <text x="842" y="196"><tspan class="k">Formação</tspan><tspan x="950" class="v">Sistemas de Informação</tspan></text>
    <text x="842" y="220"><tspan class="k">Ensino</tspan><tspan x="950" class="v">IFMT · Pontes e Lacerda</tspan></text>
    <text x="842" y="244"><tspan class="k">Base</tspan><tspan x="950" class="v">Mato Grosso, Brasil</tspan></text>
    <text x="842" y="268"><tspan class="k">Status</tspan><tspan x="950" fill="#9DBF88" font-size="14">● disponível</tspan></text>
  </g>
  <g>
    <rect x="842" y="286" width="26" height="14" fill="#0E1411" stroke="#2A3A30"/>
    <rect x="872" y="286" width="26" height="14" fill="#2A3A30"/>
    <rect x="902" y="286" width="26" height="14" fill="#C2502E"/>
    <rect x="932" y="286" width="26" height="14" fill="#E8A33D"/>
    <rect x="962" y="286" width="26" height="14" fill="#9DBF88"/>
    <rect x="992" y="286" width="26" height="14" fill="#F2E8D5"/>
  </g>
</svg>
