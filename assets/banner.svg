<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ryam Soares — Full-Stack Developer e Professor no IFMT">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B100D"/>
      <stop offset="1" stop-color="#16201A"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C46B"/>
      <stop offset="0.55" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#C2502E"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1610"/>
      <stop offset="1" stop-color="#120B08"/>
    </linearGradient>
    <!-- faixas horizontais recortadas no sol (pôr do sol "scanline") -->
    <mask id="sunStripes">
      <rect x="0" y="0" width="1200" height="340" fill="#fff"/>
      <rect x="760" y="190" width="340" height="4" fill="#000"/>
      <rect x="760" y="204" width="340" height="6" fill="#000"/>
      <rect x="760" y="219" width="340" height="8" fill="#000"/>
      <rect x="760" y="236" width="340" height="10" fill="#000"/>
    </mask>
    <clipPath id="aboveHorizon"><rect x="0" y="0" width="1200" height="250"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .glow { animation: pulse 6s ease-in-out infinite; transform-origin: 930px 250px; }
      .spark { animation: flow 3.2s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .08; } 50% { opacity: .16; } }
      @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -60; } }
    </style>
  </defs>

  <!-- céu -->
  <rect width="1200" height="340" fill="url(#sky)"/>
  <g fill="#F2E8D5" opacity=".55">
    <circle cx="640" cy="40" r="1.2"/><circle cx="700" cy="88" r="1"/><circle cx="1110" cy="52" r="1.3"/>
    <circle cx="1040" cy="26" r="1"/><circle cx="560" cy="70" r="1"/><circle cx="1160" cy="120" r="1"/>
    <circle cx="760" cy="30" r="1.1"/><circle cx="860" cy="60" r="0.9"/>
  </g>

  <!-- sol do cerrado -->
  <circle class="glow" cx="930" cy="250" r="165" fill="#E8A33D"/>
  <g clip-path="url(#aboveHorizon)">
    <circle cx="930" cy="250" r="130" fill="url(#sun)" mask="url(#sunStripes)"/>
  </g>

  <!-- árvores retorcidas do cerrado na linha do horizonte -->
  <g fill="#0B100D">
    <path d="M610 250 q4 -26 -8 -40 q14 6 12 -14 q10 12 22 2 q-4 16 10 20 q-18 4 -22 32 z"/>
    <path d="M598 214 q-16 -6 -26 2 q10 -14 28 -8 z"/>
    <path d="M748 250 q2 -18 -6 -30 q10 4 10 -10 q8 10 16 0 q-2 12 8 14 q-14 4 -16 26 z"/>
    <path d="M1120 250 q6 -34 -10 -52 q16 8 16 -18 q12 14 28 2 q-6 20 12 26 q-22 6 -28 42 z"/>
    <path d="M1108 200 q-22 -8 -34 4 q12 -20 36 -10 z"/>
    <ellipse cx="520" cy="250" rx="40" ry="6"/>
    <ellipse cx="830" cy="250" rx="60" ry="5"/>
  </g>

  <!-- torre de transmissão + linha de energia -->
  <g stroke="#0B100D" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M1030 250 L1046 150 L1062 250"/>
    <path d="M1034 228 L1058 228 M1038 204 L1054 204 M1042 180 L1050 180"/>
    <path d="M1035 228 L1054 204 L1040 180 M1057 228 L1038 204 L1052 180"/>
    <path d="M1022 160 L1070 160 M1028 172 L1064 172"/>
  </g>
  <path d="M684 250 L684 186 M674 190 L694 190" stroke="#0B100D" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M684 190 Q860 214 1022 160 M1070 160 Q1140 190 1200 178" stroke="#0B100D" stroke-width="1.6" fill="none" opacity=".9"/>
  <path class="spark" d="M684 190 Q860 214 1022 160 M1070 160 Q1140 190 1200 178" stroke="#E8A33D" stroke-width="1.6" fill="none" stroke-dasharray="6 54" opacity=".9"/>

  <!-- solo de terra vermelha com fileiras de plantio em perspectiva -->
  <rect x="0" y="250" width="1200" height="90" fill="url(#soil)"/>
  <line x1="0" y1="250" x2="1200" y2="250" stroke="#E8A33D" stroke-width="1.2" opacity=".7"/>
  <g stroke="#C2502E" stroke-width="1" opacity=".42">
    <line x1="930" y1="250" x2="-300" y2="340"/><line x1="930" y1="250" x2="0" y2="340"/>
    <line x1="930" y1="250" x2="260" y2="340"/><line x1="930" y1="250" x2="500" y2="340"/>
    <line x1="930" y1="250" x2="720" y2="340"/><line x1="930" y1="250" x2="930" y2="340"/>
    <line x1="930" y1="250" x2="1140" y2="340"/><line x1="930" y1="250" x2="1360" y2="340"/>
    <line x1="930" y1="250" x2="1600" y2="340"/>
    <line x1="0" y1="262" x2="1200" y2="262"/><line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="306" x2="1200" y2="306"/>
  </g>

  <!-- texto -->
  <g class="mono">
    <text x="60" y="66" font-size="15" fill="#E8A33D" letter-spacing="2">&gt; CERRADO//OS  ·  v26.11  ·  boot ok</text>
    <text x="58" y="138" font-size="66" font-weight="700" fill="#F2E8D5" letter-spacing="1">RYAM SOARES</text>
    <text x="60" y="178" font-size="21" fill="#E8A33D">full-stack developer  ·  professor @ IFMT</text>
    <text x="60" y="212" font-size="15" fill="#9DBF88">TypeScript · NestJS · React · Prisma · PostgreSQL</text>
    <rect class="cursor" x="520" y="198" width="9" height="17" fill="#E8A33D"/>
    <text x="60" y="318" font-size="12" fill="#C2502E" letter-spacing="3">MATO GROSSO · BR  —  ENERGIA · AGRO · EDUCAÇÃO</text>
  </g>
</svg>
